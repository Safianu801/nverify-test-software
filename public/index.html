<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>SaaS Chat Workspace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Inter", sans-serif;
        -webkit-tap-highlight-color: transparent;
      }
      #chatScroll::-webkit-scrollbar,
      #convoList::-webkit-scrollbar {
        width: 5px;
      }
      #chatScroll::-webkit-scrollbar-thumb,
      #convoList::-webkit-scrollbar-thumb {
        background: rgba(0, 0, 0, 0.15);
        border-radius: 10px;
      }
      .chat-bg {
        background-color: #efeae2;
        background-image: url("https://www.transparenttextures.com/patterns/cubes.png");
        background-blend-mode: overlay;
      }
      .fade-in {
        animation: fadeIn 0.3s ease-in-out;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .ring-animation {
        animation: ring 1.5s infinite ease-in-out;
      }
      @keyframes ring {
        0% {
          transform: scale(1);
          box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7);
        }
        70% {
          transform: scale(1.05);
          box-shadow: 0 0 0 15px rgba(34, 197, 94, 0);
        }
        100% {
          transform: scale(1);
          box-shadow: 0 0 0 0 rgba(34, 197, 94, 0);
        }
      }
    </style>
  </head>
  <body class="h-[100dvh] w-screen bg-slate-100 overflow-hidden text-slate-800">
    <!-- 1. LOGIN SCREEN -->
    <div
      id="loginScreen"
      class="absolute inset-0 z-50 flex items-center justify-center bg-gradient-to-br from-slate-900 to-slate-800 p-4"
    >
      <div
        class="bg-white rounded-3xl shadow-2xl p-6 sm:p-10 w-full max-w-md fade-in"
      >
        <div class="text-center mb-8">
          <div
            class="w-16 h-16 bg-blue-50 text-blue-600 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-sm"
          >
            <svg
              class="w-8 h-8"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"
              ></path>
            </svg>
          </div>
          <h2 class="text-2xl font-bold text-slate-800">SaaS Chat Login</h2>
        </div>
        <div class="space-y-4">
          <div>
            <label
              class="text-xs font-semibold text-slate-500 uppercase tracking-wider"
              >My User ID</label
            ><input
              id="myUserId"
              class="mt-1.5 p-3.5 bg-slate-50 border border-slate-200 rounded-xl w-full outline-none"
              placeholder="e.g. UserA"
            />
          </div>
          <div>
            <label
              class="text-xs font-semibold text-slate-500 uppercase tracking-wider"
              >Receiver ID</label
            ><input
              id="receiverId"
              class="mt-1.5 p-3.5 bg-slate-50 border border-slate-200 rounded-xl w-full outline-none"
              placeholder="e.g. UserB"
            />
          </div>
          <div>
            <label
              class="text-xs font-semibold text-slate-500 uppercase tracking-wider"
              >Conversation ID</label
            ><input
              id="convId"
              class="mt-1.5 p-3.5 bg-slate-50 border border-slate-200 rounded-xl w-full font-mono text-sm"
              value="conv_123"
            />
          </div>
          <button
            id="startChatBtn"
            class="w-full bg-blue-600 hover:bg-blue-700 text-white py-4 rounded-xl font-bold transition-colors mt-2 shadow-lg"
          >
            Connect & Enter Workspace
          </button>
        </div>
      </div>
    </div>

    <!-- 2. MAIN DASHBOARD -->
    <div
      id="mainApp"
      class="h-full w-full flex hidden max-w-[1600px] mx-auto bg-white relative"
    >
      <aside
        id="sidebar"
        class="flex flex-col w-full md:w-[350px] lg:w-[400px] shrink-0 h-full border-r border-slate-200 bg-white z-20 absolute md:relative inset-0 transition-transform"
      >
        <div
          class="h-[60px] md:h-[70px] px-6 flex items-center justify-between border-b border-slate-200 bg-slate-50"
        >
          <div class="flex items-center gap-3">
            <div
              class="w-10 h-10 rounded-full bg-slate-800 text-white flex items-center justify-center font-bold shadow-sm"
            >
              <span id="currentUserInitial">U</span>
            </div>
            <div id="currentUserDisplay" class="font-bold text-slate-800">
              Loading...
            </div>
          </div>
        </div>
        <div id="convoList" class="flex-1 overflow-y-auto bg-white"></div>
      </aside>

      <section
        id="chatArea"
        class="hidden md:flex flex-col flex-1 h-full chat-bg relative z-10"
      >
        <div
          class="h-[70px] px-6 border-b border-slate-200 bg-slate-50 flex items-center shadow-sm sticky top-0 z-20"
        >
          <button
            onclick="showMobileList()"
            class="md:hidden mr-2 p-2 text-slate-600"
          >
            <svg
              class="w-6 h-6"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                d="M15 19l-7-7 7-7"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              ></path>
            </svg>
          </button>
          <div class="flex-1">
            <h2 id="chatHeaderTitle" class="font-bold">Select a chat</h2>
            <p id="chatHeaderSub" class="text-xs text-slate-500">
              Connect to start
            </p>
          </div>
          <button
            id="startCallBtn"
            class="p-3 text-slate-600 hover:text-green-600 hover:bg-green-50 rounded-full transition-all"
          >
            <svg
              class="w-6 h-6"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"
              ></path>
            </svg>
          </button>
        </div>
        <div
          id="chatScroll"
          class="flex-1 p-6 overflow-y-auto space-y-4 flex flex-col"
        ></div>
        <div class="p-4 bg-slate-50 border-t border-slate-200 flex gap-2">
          <input
            id="messageInput"
            class="flex-1 bg-white border border-slate-300 rounded-full px-5 py-3 outline-none"
            placeholder="Type a message"
            disabled
          />
          <button
            id="sendBtn"
            class="bg-blue-600 text-white w-12 h-12 rounded-full flex items-center justify-center disabled:opacity-50"
            disabled
          >
            <svg
              class="w-5 h-5 ml-1 transform rotate-45"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-width="2"
                d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"
              ></path>
            </svg>
          </button>
        </div>
      </section>

      <!-- 3. INCOMING CALL MODAL -->
      <div
        id="incomingCallModal"
        class="hidden absolute inset-0 z-[60] bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4"
      >
        <div
          class="bg-white rounded-3xl p-8 max-w-sm w-full text-center shadow-2xl"
        >
          <div
            class="w-24 h-24 bg-slate-800 rounded-full mx-auto mb-4 flex items-center justify-center text-4xl text-white font-bold ring-animation"
          >
            <span id="incomingCallAvatar">A</span>
          </div>
          <h3 id="incomingCallName" class="text-2xl font-bold">User Name</h3>
          <p class="text-slate-500 mb-8">Incoming Video Call...</p>
          <div class="flex justify-center gap-6">
            <button
              id="rejectCallBtn"
              class="w-16 h-16 bg-red-500 text-white rounded-full flex items-center justify-center transform rotate-[135deg]"
            >
              <svg
                class="w-8 h-8"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-width="2"
                  d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"
                ></path>
              </svg>
            </button>
            <button
              id="acceptCallBtn"
              class="w-16 h-16 bg-green-500 text-white rounded-full flex items-center justify-center ring-animation"
            >
              <svg
                class="w-8 h-8"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-width="2"
                  d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"
                ></path>
              </svg>
            </button>
          </div>
        </div>
      </div>

      <!-- 4. ACTIVE VIDEO CALL STAGE -->
      <div
        id="videoCallStage"
        class="hidden absolute inset-0 z-[70] bg-[#111] flex flex-col fade-in"
      >
        <video
          id="remoteVideo"
          class="absolute inset-0 w-full h-full object-cover"
          autoplay
          playsinline
        ></video>
        <div
          class="absolute top-0 left-0 w-full p-6 bg-gradient-to-b from-black/60 to-transparent z-10"
        >
          <h2 id="videoCallPeerName" class="text-white text-xl font-bold">
            Calling...
          </h2>
          <p id="videoCallStatus" class="text-white/80 text-sm">Ringing</p>
        </div>
        <div
          class="absolute top-6 right-6 w-32 h-48 bg-gray-800 rounded-xl overflow-hidden border-2 border-white/20 z-10"
        >
          <video
            id="localVideo"
            class="w-full h-full object-cover"
            autoplay
            playsinline
            muted
          ></video>
        </div>
        <div
          class="absolute bottom-8 left-1/2 transform -translate-x-1/2 flex items-center gap-4 px-6 py-4 bg-black/40 backdrop-blur-md rounded-full border border-white/10 z-10"
        >
          <button
            id="toggleAudioBtn"
            class="w-12 h-12 bg-white/20 text-white rounded-full flex items-center justify-center transition"
          >
            <svg
              class="w-5 h-5"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-width="2"
                d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"
              ></path>
            </svg>
          </button>
          <button
            id="endCallBtn"
            class="w-14 h-14 bg-red-500 text-white rounded-full flex items-center justify-center transform rotate-[135deg]"
          >
            <svg
              class="w-7 h-7"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-width="2"
                d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"
              ></path>
            </svg>
          </button>
        </div>
      </div>
    </div>

    <template id="msgTpl">
      <div class="msg-wrapper flex items-end w-full justify-start mt-1">
        <div
          class="msg-bubble bg-white shadow-sm p-3 rounded-2xl relative max-w-[85%]"
        >
          <div class="msg-text text-[15px]"></div>
          <div class="text-[10px] text-slate-400 mt-1 flex justify-end gap-1">
            <span class="sender-time"></span>
            <span class="read-status text-blue-500 hidden">✓✓</span>
          </div>
        </div>
      </div>
    </template>

    <script>
      const LOCAL_URL = "https://nverify-test-software.onrender.com";
      const [myId, recId, convId, btn, chat, msgInput, sendBtn] = [
        "myUserId",
        "receiverId",
        "convId",
        "startChatBtn",
        "chatScroll",
        "messageInput",
        "sendBtn",
      ].map((id) => document.getElementById(id));

      let socket, activeUser, currentRoom;

      // VIDEO CALL STATE
      let localStream,
        peerConnection,
        activeCallId = null,
        isCaller = false;
      let iceConfig = {
        iceServers: [{ urls: "stun:stun.l.google.com:19302" }],
      };

      btn.onclick = () => {
        activeUser = myId.value.trim();
        currentRoom = convId.value.trim();
        if (!activeUser || !currentRoom) return alert("IDs required!");

        socket = io(LOCAL_URL, {
          auth: { identity: { userID: activeUser } },
          transports: ["polling", "websocket"],
        });

        socket.on("connect", () => {
          document.getElementById("loginScreen").classList.add("hidden");
          document.getElementById("mainApp").classList.remove("hidden");
          msgInput.disabled = sendBtn.disabled = false;
          socket.emit("chat:joinChat", {
            conversationId: currentRoom,
            senderId: activeUser,
          });
        });

        // RECEIVE DYNAMIC TURN SERVERS
        socket.on("video:iceConfig", (data) => {
          console.log("TURN credentials received");
          iceConfig = { iceServers: data.iceServers };
        });

        socket.on("video:incomingCall", ({ callId, callerId }) => {
          activeCallId = callId;
          document.getElementById("incomingCallName").textContent = callerId;
          document
            .getElementById("incomingCallModal")
            .classList.remove("hidden");
        });

        socket.on("video:callResponse", async ({ status }) => {
          if (status === "accepted") {
            await initMedia();
            socket.emit("video:joinRoom", {
              callId: activeCallId,
              participantId: activeUser,
            });
          } else resetVideoCall();
        });

        socket.on("video:userJoined", async () => {
          if (isCaller) {
            createPeerConnection();
            const offer = await peerConnection.createOffer();
            await peerConnection.setLocalDescription(offer);
            socket.emit("video:offer", {
              callId: activeCallId,
              data: offer,
              senderId: activeUser,
            });
          }
        });

        socket.on("video:offer", async ({ data }) => {
          createPeerConnection();
          await peerConnection.setRemoteDescription(data);
          const answer = await peerConnection.createAnswer();
          await peerConnection.setLocalDescription(answer);
          socket.emit("video:answer", {
            callId: activeCallId,
            data: answer,
            senderId: activeUser,
          });
        });

        socket.on("video:answer", async ({ data }) => {
          await peerConnection.setRemoteDescription(data);
        });

        socket.on("video:iceCandidate", async ({ data }) => {
          if (data && peerConnection)
            await peerConnection.addIceCandidate(data);
        });

        socket.on("video:userLeft", () => resetVideoCall());
      };

      async function initMedia() {
        localStream = await navigator.mediaDevices.getUserMedia({
          video: true,
          audio: true,
        });
        document.getElementById("localVideo").srcObject = localStream;
        document.getElementById("videoCallStage").classList.remove("hidden");
      }

      function createPeerConnection() {
        // Uses the dynamic credentials sent from backend
        peerConnection = new RTCPeerConnection(iceConfig);
        localStream
          .getTracks()
          .forEach((t) => peerConnection.addTrack(t, localStream));
        peerConnection.ontrack = (e) =>
          (document.getElementById("remoteVideo").srcObject = e.streams[0]);
        peerConnection.onicecandidate = (e) => {
          if (e.candidate)
            socket.emit("video:iceCandidate", {
              callId: activeCallId,
              data: e.candidate,
              senderId: activeUser,
            });
        };
      }

      function resetVideoCall() {
        if (localStream) localStream.getTracks().forEach((t) => t.stop());
        if (peerConnection) peerConnection.close();
        document.getElementById("videoCallStage").classList.add("hidden");
        document.getElementById("incomingCallModal").classList.add("hidden");
        peerConnection = null;
        localStream = null;
        activeCallId = null;
        isCaller = false;
      }

      // BUTTON HANDLERS
      document.getElementById("startCallBtn").onclick = () => {
        isCaller = true;
        activeCallId = `call_${Date.now()}`;
        socket.emit("video:initiateCall", {
          callId: activeCallId,
          callerId: activeUser,
          receiverId: recId.value,
        });
        socket.emit("video:joinRoom", {
          callId: activeCallId,
          participantId: activeUser,
        });
      };

      document.getElementById("acceptCallBtn").onclick = () => {
        socket.emit("video:respondToCall", {
          callId: activeCallId,
          status: "accepted",
          callerId: document.getElementById("incomingCallName").textContent,
          responderId: activeUser,
        });
      };

      document.getElementById("rejectCallBtn").onclick = () => {
        socket.emit("video:respondToCall", {
          callId: activeCallId,
          status: "rejected",
          callerId: document.getElementById("incomingCallName").textContent,
          responderId: activeUser,
        });
        resetVideoCall();
      };

      document.getElementById("endCallBtn").onclick = () => {
        socket.emit("video:leaveCall", {
          callId: activeCallId,
          participantId: activeUser,
        });
        resetVideoCall();
      };
    </script>
  </body>
</html>
