<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>SaaS Chat Workspace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Inter", sans-serif;
        -webkit-tap-highlight-color: transparent;
      }
      /* Custom Scrollbars */
      #chatScroll::-webkit-scrollbar,
      #convoList::-webkit-scrollbar {
        width: 5px;
      }
      #chatScroll::-webkit-scrollbar-thumb,
      #convoList::-webkit-scrollbar-thumb {
        background: rgba(0, 0, 0, 0.15);
        border-radius: 10px;
      }

      /* Chat Background Pattern */
      .chat-bg {
        background-color: #efeae2;
        background-image: url("https://www.transparenttextures.com/patterns/cubes.png");
        background-blend-mode: overlay;
      }

      /* Animations */
      .fade-in {
        animation: fadeIn 0.3s ease-in-out;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* Video specific animations */
      .ring-animation {
        animation: ring 1.5s infinite ease-in-out;
      }
      @keyframes ring {
        0% {
          transform: scale(1);
          box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7);
        }
        70% {
          transform: scale(1.05);
          box-shadow: 0 0 0 15px rgba(34, 197, 94, 0);
        }
        100% {
          transform: scale(1);
          box-shadow: 0 0 0 0 rgba(34, 197, 94, 0);
        }
      }
    </style>
  </head>
  <body class="h-[100dvh] w-screen bg-slate-100 overflow-hidden text-slate-800">
    <!-- ==============================
         1. LOGIN SCREEN 
         ============================== -->
    <!-- (Your login screen remains completely untouched here. Omitting inner code for brevity, KEEP YOURS EXACTLY THE SAME) -->
    <div
      id="loginScreen"
      class="absolute inset-0 z-50 flex items-center justify-center bg-gradient-to-br from-slate-900 to-slate-800 p-4"
    >
      <div
        class="bg-white rounded-3xl shadow-2xl p-6 sm:p-10 w-full max-w-md fade-in"
      >
        <div class="text-center mb-8">
          <div
            class="w-16 h-16 bg-blue-50 text-blue-600 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-sm"
          >
            <svg
              class="w-8 h-8"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"
              ></path>
            </svg>
          </div>
          <h2 class="text-2xl font-bold text-slate-800">SaaS Chat Login</h2>
          <p class="text-sm text-slate-500 mt-1">
            Enter your details to connect
          </p>
        </div>
        <div class="space-y-4">
          <div>
            <label
              class="text-xs font-semibold text-slate-500 uppercase tracking-wider"
              >My User ID</label
            ><input
              id="myUserId"
              class="mt-1.5 p-3.5 bg-slate-50 border border-slate-200 rounded-xl w-full focus:ring-2 focus:ring-blue-500 outline-none transition-all"
              placeholder="e.g. UserA"
            />
          </div>
          <div>
            <label
              class="text-xs font-semibold text-slate-500 uppercase tracking-wider"
              >Receiver ID</label
            ><input
              id="receiverId"
              class="mt-1.5 p-3.5 bg-slate-50 border border-slate-200 rounded-xl w-full focus:ring-2 focus:ring-blue-500 outline-none transition-all"
              placeholder="e.g. UserB"
            />
          </div>
          <div>
            <label
              class="text-xs font-semibold text-slate-500 uppercase tracking-wider"
              >Conversation ID</label
            ><input
              id="convId"
              class="mt-1.5 p-3.5 bg-slate-50 border border-slate-200 rounded-xl w-full focus:ring-2 focus:ring-blue-500 outline-none transition-all font-mono text-sm"
              value="conv_123"
            />
          </div>
          <button
            id="startChatBtn"
            class="w-full bg-blue-600 hover:bg-blue-700 text-white py-4 rounded-xl font-bold transition-colors mt-2 shadow-lg shadow-blue-600/30"
          >
            Connect & Enter Workspace
          </button>
        </div>
      </div>
    </div>

    <!-- ==============================
         2. MAIN DASHBOARD 
         ============================== -->
    <div
      id="mainApp"
      class="h-full w-full flex hidden max-w-[1600px] mx-auto shadow-2xl bg-white relative"
    >
      <!-- SIDEBAR -->
      <aside
        id="sidebar"
        class="flex flex-col w-full md:w-[350px] lg:w-[400px] shrink-0 h-full border-r border-slate-200 bg-white z-20 absolute md:relative inset-0 transition-transform"
      >
        <div
          class="h-[60px] md:h-[70px] px-4 md:px-6 flex items-center justify-between border-b border-slate-200 bg-slate-50"
        >
          <div class="flex items-center gap-3">
            <div
              class="w-10 h-10 rounded-full bg-slate-800 text-white flex items-center justify-center font-bold shadow-sm"
            >
              <span id="currentUserInitial">U</span>
            </div>
            <div class="hidden sm:block">
              <div
                id="currentUserDisplay"
                class="font-bold text-slate-800 leading-tight"
              >
                Loading...
              </div>
              <div
                class="text-[11px] text-green-600 font-semibold flex items-center gap-1"
              >
                <div class="w-1.5 h-1.5 rounded-full bg-green-500"></div>
                Online
              </div>
            </div>
          </div>
        </div>
        <div class="p-3 border-b border-slate-100">
          <div class="bg-slate-100 rounded-lg flex items-center px-3 py-2">
            <svg
              class="w-4 h-4 text-slate-400"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
              ></path>
            </svg>
            <input
              type="text"
              placeholder="Search or start new chat"
              class="bg-transparent w-full ml-2 outline-none text-sm text-slate-700 placeholder-slate-400"
            />
          </div>
        </div>
        <div id="convoList" class="flex-1 overflow-y-auto bg-white"></div>
      </aside>

      <!-- CHAT AREA -->
      <section
        id="chatArea"
        class="hidden md:flex flex-col flex-1 h-full chat-bg relative z-10 w-full absolute md:relative inset-0"
      >
        <!-- Chat Header -->
        <div
          class="h-[60px] md:h-[70px] px-3 md:px-6 border-b border-slate-200 bg-slate-50 flex items-center shadow-sm sticky top-0 z-20"
        >
          <button
            onclick="showMobileList()"
            class="md:hidden mr-2 p-2 text-slate-600 rounded-full hover:bg-slate-200 active:bg-slate-300 transition"
          >
            <svg
              class="w-6 h-6"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M15 19l-7-7 7-7"
              ></path>
            </svg>
          </button>
          <div class="flex items-center gap-3 flex-1 cursor-pointer">
            <div
              id="headerAvatar"
              class="w-10 h-10 rounded-full bg-slate-300 text-slate-700 flex items-center justify-center font-bold shadow-sm shrink-0"
            >
              U
            </div>
            <div class="flex-1 min-w-0">
              <h2
                id="chatHeaderTitle"
                class="text-[16px] md:text-lg font-bold text-slate-800 truncate leading-tight"
              >
                Select a chat
              </h2>
              <div class="flex items-center gap-2 mt-0.5">
                <p
                  id="chatHeaderSub"
                  class="text-[12px] text-slate-500 truncate"
                >
                  Connect to start messaging
                </p>
                <span
                  id="typingIndicator"
                  class="text-[12px] text-blue-600 font-bold hidden animate-pulse bg-blue-100/50 px-2 rounded-full"
                  >Typing...</span
                >
              </div>
            </div>
          </div>
          <!-- NEW: Video Call Button -->
          <button
            id="startCallBtn"
            class="p-3 text-slate-600 hover:text-green-600 hover:bg-green-50 rounded-full transition-all shrink-0"
          >
            <svg
              class="w-6 h-6"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"
              ></path>
            </svg>
          </button>
        </div>

        <!-- Chat Messages -->
        <div
          id="chatScroll"
          class="flex-1 p-4 md:p-8 overflow-y-auto space-y-4 md:space-y-6 flex flex-col"
        ></div>

        <!-- Input Area -->
        <div class="p-3 md:p-4 bg-slate-50 border-t border-slate-200">
          <div class="flex items-center gap-2 max-w-5xl mx-auto">
            <div class="flex-1 relative">
              <input
                id="messageInput"
                class="w-full bg-white border border-slate-300 rounded-full px-5 py-3 md:py-3.5 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 transition-all text-slate-800 text-[15px] shadow-sm"
                placeholder="Type a message"
                disabled
              />
            </div>
            <button
              id="sendBtn"
              class="bg-blue-600 hover:bg-blue-700 text-white w-12 h-12 md:w-14 md:h-14 rounded-full flex items-center justify-center disabled:opacity-50 disabled:cursor-not-allowed shadow-md transition-transform active:scale-95 shrink-0"
              disabled
            >
              <svg
                class="w-5 h-5 md:w-6 md:h-6 ml-1 transform rotate-45"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"
                ></path>
              </svg>
            </button>
          </div>
        </div>
      </section>

      <!-- ==============================
           3. INCOMING CALL MODAL 
           ============================== -->
      <div
        id="incomingCallModal"
        class="hidden absolute inset-0 z-[60] bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 fade-in"
      >
        <div
          class="bg-white rounded-3xl p-8 max-w-sm w-full text-center shadow-2xl"
        >
          <div
            class="w-24 h-24 bg-slate-800 rounded-full mx-auto mb-4 flex items-center justify-center text-4xl text-white font-bold ring-animation"
          >
            <span id="incomingCallAvatar">A</span>
          </div>
          <h3 id="incomingCallName" class="text-2xl font-bold text-slate-800">
            User Name
          </h3>
          <p class="text-slate-500 mt-1 mb-8">Incoming Video Call...</p>

          <div class="flex justify-center gap-6">
            <button
              id="rejectCallBtn"
              class="w-16 h-16 bg-red-500 hover:bg-red-600 text-white rounded-full flex items-center justify-center shadow-lg transition-transform active:scale-95"
            >
              <svg
                class="w-8 h-8 transform rotate-[135deg]"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"
                ></path>
              </svg>
            </button>
            <button
              id="acceptCallBtn"
              class="w-16 h-16 bg-green-500 hover:bg-green-600 text-white rounded-full flex items-center justify-center shadow-lg transition-transform active:scale-95 ring-animation"
            >
              <svg
                class="w-8 h-8"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"
                ></path>
              </svg>
            </button>
          </div>
        </div>
      </div>

      <!-- ==============================
           4. ACTIVE VIDEO CALL STAGE 
           ============================== -->
      <div
        id="videoCallStage"
        class="hidden absolute inset-0 z-[70] bg-[#111] flex flex-col fade-in"
      >
        <!-- Remote Video (Full Screen) -->
        <video
          id="remoteVideo"
          class="absolute inset-0 w-full h-full object-cover"
          autoplay
          playsinline
        ></video>

        <!-- Header (Overlay) -->
        <div
          class="absolute top-0 left-0 w-full p-6 flex justify-between items-start bg-gradient-to-b from-black/60 to-transparent z-10"
        >
          <div>
            <h2
              id="videoCallPeerName"
              class="text-white text-xl font-bold shadow-sm"
            >
              Calling...
            </h2>
            <p id="videoCallStatus" class="text-white/80 text-sm">Ringing</p>
          </div>
        </div>

        <!-- Local Video (PiP Window) -->
        <div
          class="absolute top-6 right-6 w-28 h-40 md:w-40 md:h-56 bg-gray-800 rounded-xl overflow-hidden shadow-2xl border-2 border-white/20 z-10"
        >
          <video
            id="localVideo"
            class="w-full h-full object-cover"
            autoplay
            playsinline
            muted
          ></video>
        </div>

        <!-- Controls Dock (Bottom) -->
        <div
          class="absolute bottom-8 left-1/2 transform -translate-x-1/2 flex items-center gap-4 px-6 py-4 bg-black/40 backdrop-blur-md rounded-full border border-white/10 z-10 shadow-2xl"
        >
          <button
            id="toggleAudioBtn"
            class="w-12 h-12 bg-white/20 hover:bg-white/30 text-white rounded-full flex items-center justify-center transition"
          >
            <svg
              class="w-5 h-5"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"
              ></path>
            </svg>
          </button>
          <button
            id="toggleVideoBtn"
            class="w-12 h-12 bg-white/20 hover:bg-white/30 text-white rounded-full flex items-center justify-center transition"
          >
            <svg
              class="w-5 h-5"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"
              ></path>
            </svg>
          </button>
          <button
            id="endCallBtn"
            class="w-14 h-14 bg-red-500 hover:bg-red-600 text-white rounded-full flex items-center justify-center shadow-lg transition"
          >
            <svg
              class="w-7 h-7 transform rotate-[135deg]"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"
              ></path>
            </svg>
          </button>
        </div>
      </div>
    </div>

    <!-- Message Template (Untouched) -->
    <template id="msgTpl">
      <div class="msg-wrapper flex items-end w-full justify-start mt-1">
        <div
          class="msg-bubble bg-white shadow-[0_1px_2px_rgba(0,0,0,0.1)] p-2.5 md:p-3 rounded-2xl rounded-tl-none relative group min-w-[100px] max-w-[85%] md:max-w-[65%]"
        >
          <div
            class="text-[15px] msg-text whitespace-pre-wrap text-slate-800 leading-relaxed break-words"
          ></div>
          <div
            class="text-[10px] text-slate-400 mt-1 flex justify-end items-center gap-1.5 float-right ml-4 pt-1"
          >
            <span class="sender-time font-medium"></span>
            <span class="read-status text-blue-500 font-bold hidden">
              <svg
                class="w-3.5 h-3.5"
                viewBox="0 0 16 15"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M1 8.5l3.5 3.5 7-7" />
                <path d="M6.5 12l2.5 2.5 6-6" />
              </svg>
            </span>
          </div>
          <div
            class="reactions-display absolute -bottom-3 right-2 bg-white border border-slate-100 shadow-sm rounded-full px-2 py-0.5 text-xs hidden z-10"
          ></div>
          <div
            class="actions absolute -top-8 right-0 bg-slate-800 text-white rounded-lg shadow-lg hidden group-hover:flex overflow-hidden transform scale-90 origin-bottom-right z-20"
          >
            <button
              class="emoji-btn text-xs px-3 py-2 hover:bg-slate-700 border-r border-slate-700 transition"
            >
              😊
            </button>
            <button
              class="delete-btn text-xs px-3 py-2 text-red-400 hover:bg-slate-700 transition hidden"
            >
              Delete
            </button>
          </div>
        </div>
      </div>
    </template>

    <script>
      // ==========================================
      // GLOBAL VARS & SETUP
      // ==========================================
      const LOCAL_URL = "https://nverify-test-software.onrender.com";
      // const LOCAL_URL = "http://localhost:4000";

      const [
        myId,
        recId,
        convId,
        btn,
        chat,
        msgInput,
        sendBtn,
        typInd,
        convoList,
      ] = [
        "myUserId",
        "receiverId",
        "convId",
        "startChatBtn",
        "chatScroll",
        "messageInput",
        "sendBtn",
        "typingIndicator",
        "convoList",
      ].map((id) => document.getElementById(id));

      const sidebarEl = document.getElementById("sidebar");
      const chatAreaEl = document.getElementById("chatArea");

      let socket, activeUser, currentRoom;
      const domNodes = new Map();

      // Mobile UI Toggles
      function showLogin() {
        document.getElementById("mainApp").classList.add("hidden");
        document.getElementById("loginScreen").classList.remove("hidden");
        if (socket) socket.disconnect();
      }
      function showMobileChat() {
        sidebarEl.classList.add("hidden", "md:flex");
        sidebarEl.classList.remove("flex");
        chatAreaEl.classList.remove("hidden", "md:flex");
        chatAreaEl.classList.add("flex");
      }
      function showMobileList() {
        sidebarEl.classList.remove("hidden", "md:flex");
        sidebarEl.classList.add("flex");
        chatAreaEl.classList.add("hidden", "md:flex");
        chatAreaEl.classList.remove("flex");
        document.getElementById("chatHeaderTitle").textContent =
          "Select a chat";
        document.getElementById("chatHeaderSub").textContent =
          "Connect to start messaging";
        currentRoom = null;
      }

      // ==========================================
      // CHAT LOGIC (Preserved exactly as is)
      // ==========================================
      function renderMsg(msg) {
        if (domNodes.has(msg._id)) return;
        const tpl = document.getElementById("msgTpl").content.cloneNode(true);
        const [wrapper, bubble, text, delBtn, readSt, reactDisp, time] = [
          ".msg-wrapper",
          ".msg-bubble",
          ".msg-text",
          ".delete-btn",
          ".read-status",
          ".reactions-display",
          ".sender-time",
        ].map((sel) => tpl.querySelector(sel));

        domNodes.set(msg._id, wrapper);
        text.textContent = msg.deleted ? "🚫 Message deleted" : msg.message;
        time.textContent = new Date(msg.createdAt).toLocaleTimeString([], {
          hour: "2-digit",
          minute: "2-digit",
        });

        if (msg.senderId === activeUser) {
          wrapper.classList.remove("justify-start");
          wrapper.classList.add("justify-end");
          bubble.classList.replace("bg-white", "bg-[#d9fdd3]");
          bubble.classList.replace("rounded-tl-none", "rounded-tr-none");
          if (!msg.deleted) delBtn.classList.remove("hidden");
          if (msg.seen) readSt.classList.remove("hidden");
        } else {
          bubble.classList.add("rounded-tl-none");
        }

        if (msg.reactions?.length) {
          reactDisp.textContent = msg.reactions
            .map((r) => r.reaction)
            .join(" ");
          reactDisp.classList.remove("hidden");
        }

        tpl.querySelector(".emoji-btn").onclick = () => {
          const r = prompt("React with Emoji (e.g. 👍, ❤️)");
          if (r && socket)
            socket.emit("chat:addReaction", {
              messageId: msg._id,
              reaction: r,
              senderId: activeUser,
            });
        };

        delBtn.onclick = () => {
          if (confirm("Delete this message?"))
            socket.emit("chat:deleteMessage", {
              messageId: msg._id,
              senderId: activeUser,
            });
        };

        wrapper.onmouseenter = () => {
          if (msg.receiverId === activeUser && !msg.seen) {
            socket.emit("chat:markAsRead", {
              messageId: msg._id,
              receiverId: activeUser,
            });
            msg.seen = true;
          }
        };

        chat.appendChild(tpl);
        setTimeout(() => (chat.scrollTop = chat.scrollHeight), 50);
      }

      btn.onclick = () => {
        activeUser = myId.value.trim();
        currentRoom = convId.value.trim();

        if (!activeUser || !currentRoom)
          return alert("My User ID and Conversation ID are required!");
        if (socket) socket.disconnect();

        socket = io(LOCAL_URL, {
          auth: { identity: { userID: activeUser } },
          transports: ["polling", "websocket"],
        });

        socket.on("connect", () => {
          msgInput.disabled = sendBtn.disabled = false;
          document.getElementById("loginScreen").classList.add("hidden");
          document.getElementById("mainApp").classList.remove("hidden");
          document.getElementById("currentUserDisplay").textContent =
            activeUser;
          document.getElementById("currentUserInitial").textContent =
            activeUser[0].toUpperCase();
          document.getElementById("chatHeaderTitle").textContent =
            recId.value.trim() || currentRoom;
          document.getElementById("chatHeaderSub").textContent = "Online";
          document.getElementById("headerAvatar").textContent =
            (recId.value.trim() || currentRoom)[0].toUpperCase();

          socket.emit("chat:joinChat", {
            conversationId: currentRoom,
            senderId: activeUser,
            receiverId: recId.value.trim() || null,
            endUserId: activeUser,
          });
          socket.emit("chat:getConversations");
          showMobileChat();
        });

        // Chat Socket Listeners
        socket.on("chat:error", (err) =>
          alert("Server Error: " + (err.message || JSON.stringify(err))),
        );
        socket.on("chat:history", (data) => {
          chat.innerHTML = "";
          domNodes.clear();
          data.messages.forEach(renderMsg);
        });
        socket.on("chat:newMessage", (msg) => {
          if (msg.conversationId === currentRoom) renderMsg(msg);
          socket.emit("chat:getConversations");
        });

        socket.on("chat:typing", ({ isTyping, conversationId, senderId }) => {
          if (senderId === activeUser) return;
          if (conversationId === currentRoom) {
            typInd.style.display = isTyping ? "block" : "none";
            document.getElementById("chatHeaderSub").style.display = isTyping
              ? "none"
              : "block";
          }
        });

        socket.on("chat:reactionUpdated", ({ messageId, reactions }) => {
          const d = domNodes
            .get(messageId)
            ?.querySelector(".reactions-display");
          if (d) {
            d.textContent = reactions.map((r) => r.reaction).join(" ");
            reactions.length
              ? d.classList.remove("hidden")
              : d.classList.add("hidden");
          }
        });

        socket.on("chat:messageRead", ({ messageId }) =>
          domNodes
            .get(messageId)
            ?.querySelector(".read-status")
            ?.classList.remove("hidden"),
        );

        socket.on("chat:messageDeleted", ({ messageId }) => {
          const el = domNodes.get(messageId);
          if (el) {
            const txt = el.querySelector(".msg-text");
            txt.textContent = "🚫 This message was deleted";
            txt.className = "text-[14px] text-slate-500 italic";
            el.querySelector(".actions")?.remove();
          }
        });

        socket.on("chat:conversations", ({ chats }) => {
          convoList.innerHTML = "";
          chats.forEach((c) => {
            const div = document.createElement("div");
            div.className =
              "px-4 py-3 border-b border-slate-100 cursor-pointer hover:bg-slate-50 transition-colors flex items-center justify-between group";
            const initials = (c.participantId || "G")[0].toUpperCase();
            const badge = c.unreadCount
              ? `<span class="bg-blue-500 text-white rounded-full px-2 py-0.5 text-[11px] font-bold shadow-sm shrink-0 min-w-[20px] text-center">${c.unreadCount}</span>`
              : "";
            const timeString = new Date(c.lastUpdatedAt).toLocaleTimeString(
              [],
              { hour: "2-digit", minute: "2-digit" },
            );

            div.innerHTML = `
              <div class="flex items-center gap-3 overflow-hidden w-full">
                <div class="w-12 h-12 rounded-full bg-slate-200 text-slate-600 flex items-center justify-center font-bold shrink-0 text-lg">${initials}</div>
                <div class="flex flex-col min-w-0 flex-1">
                  <div class="flex justify-between items-center mb-0.5">
                    <span class="font-bold text-slate-800 text-[15px] truncate">${c.participantId || "Group"}</span>
                    <span class="text-[11px] text-slate-400 shrink-0 ml-2 ${c.unreadCount ? "text-blue-500 font-bold" : ""}">${timeString}</span>
                  </div>
                  <div class="flex justify-between items-center">
                    <span id="convo-msg-${c.conversationId}" class="text-[13px] text-slate-500 truncate pr-2">${c.lastMessage}</span>
                    <span id="convo-typing-${c.conversationId}" class="text-[13px] font-bold text-blue-500 hidden animate-pulse">Typing...</span>
                    ${badge}
                  </div>
                </div>
              </div>
            `;
            div.onclick = () => {
              convId.value = c.conversationId;
              recId.value = c.participantId;
              document.getElementById("chatHeaderTitle").textContent =
                c.participantId;
              document.getElementById("headerAvatar").textContent = initials;
              btn.click();
            };
            convoList.appendChild(div);
          });
        });

        // ==========================================
        // VIDEO CALL LISTENERS
        // ==========================================

        socket.on("video:incomingCall", ({ callId, callerId }) => {
          activeCallId = callId;
          document.getElementById("incomingCallName").textContent = callerId;
          document.getElementById("incomingCallAvatar").textContent =
            callerId[0].toUpperCase();
          document
            .getElementById("incomingCallModal")
            .classList.remove("hidden");
        });

        socket.on("video:callResponse", async ({ callId, status }) => {
          if (status === "accepted") {
            document.getElementById("videoCallStatus").textContent =
              "Connecting...";
            await initMedia();
            socket.emit("video:joinRoom", {
              callId,
              participantId: activeUser,
            });
          } else {
            resetVideoCall();
            alert("Call Declined");
          }
        });

        socket.on("video:userJoined", async ({ participantId }) => {
          document.getElementById("videoCallStatus").textContent = "Connected";
          // If I am the caller (I started the room), I create the offer.
          if (activeCallId && isCaller) {
            createPeerConnection();
            const offer = await peerConnection.createOffer();
            await peerConnection.setLocalDescription(offer);
            socket.emit("video:offer", {
              callId: activeCallId,
              data: offer,
              senderId: activeUser,
            });
          }
        });

        socket.on("video:offer", async ({ data, senderId }) => {
          createPeerConnection();
          await peerConnection.setRemoteDescription(data);
          const answer = await peerConnection.createAnswer();
          await peerConnection.setLocalDescription(answer);
          socket.emit("video:answer", {
            callId: activeCallId,
            data: answer,
            senderId: activeUser,
          });
        });

        socket.on("video:answer", async ({ data }) => {
          await peerConnection.setRemoteDescription(data);
        });

        socket.on("video:iceCandidate", async ({ data }) => {
          if (data && peerConnection)
            await peerConnection.addIceCandidate(data);
        });

        socket.on("video:userLeft", () => {
          resetVideoCall();
          alert("The other person ended the call.");
        });
      };

      // Chat Inputs
      let typingTimeout;
      msgInput.oninput = () => {
        if (!socket) return;
        socket.emit("chat:typing:start", {
          conversationId: currentRoom,
          receiverId: recId.value.trim(),
        });
        clearTimeout(typingTimeout);
        typingTimeout = setTimeout(
          () =>
            socket.emit("chat:typing:stop", {
              conversationId: currentRoom,
              receiverId: recId.value.trim(),
            }),
          1000,
        );
      };

      sendBtn.onclick = () => {
        const messageText = msgInput.value.trim();
        if (!messageText || !socket) return;
        socket.emit("chat:sendMessage", {
          conversationId: currentRoom,
          senderId: activeUser,
          receiverId: recId.value.trim() || null,
          message: messageText,
        });
        msgInput.value = "";
        socket.emit("chat:typing:stop", {
          conversationId: currentRoom,
          receiverId: recId.value.trim(),
        });
      };

      msgInput.onkeydown = (e) => {
        if (e.key === "Enter") {
          e.preventDefault();
          sendBtn.click();
        }
      };

      // ==========================================
      // WEBRTC & VIDEO CALL LOGIC
      // ==========================================

      const localVideo = document.getElementById("localVideo");
      const remoteVideo = document.getElementById("remoteVideo");
      const videoStage = document.getElementById("videoCallStage");

      let localStream;
      let peerConnection;
      let activeCallId = null;
      let isCaller = false;

      const servers = {
        iceServers: [
          { urls: "stun:stun.l.google.com:19302" },
          {
            urls: [
              "turn:free.expressturn.com:3478?transport=udp",
              "turn:free.expressturn.com:3478?transport=tcp",
            ],
            username: "000000002093867496",
            credential: "43JkbQvWN7aFkIK7vxhfVkwTqTQ=",
          },
        ],
      };

      async function initMedia() {
        try {
          localStream = await navigator.mediaDevices.getUserMedia({
            video: true,
            audio: true,
          });
          localVideo.srcObject = localStream;
          videoStage.classList.remove("hidden");
        } catch (error) {
          console.error("Media error:", error);
          alert("Please allow camera and microphone permissions!");
        }
      }

      function createPeerConnection() {
        peerConnection = new RTCPeerConnection(servers);

        localStream.getTracks().forEach((track) => {
          peerConnection.addTrack(track, localStream);
        });

        peerConnection.ontrack = (event) => {
          remoteVideo.srcObject = event.streams[0];
        };

        peerConnection.onicecandidate = (event) => {
          if (event.candidate) {
            socket.emit("video:iceCandidate", {
              callId: activeCallId,
              data: event.candidate,
              senderId: activeUser,
            });
          }
        };
      }

      function resetVideoCall() {
        if (localStream) localStream.getTracks().forEach((t) => t.stop());
        if (peerConnection) peerConnection.close();

        localVideo.srcObject = null;
        remoteVideo.srcObject = null;
        peerConnection = null;
        localStream = null;
        activeCallId = null;
        isCaller = false;

        videoStage.classList.add("hidden");
        document.getElementById("incomingCallModal").classList.add("hidden");
      }

      // --- Buttons ---

      // Header Phone Icon clicked
      document.getElementById("startCallBtn").addEventListener("click", () => {
        const receiver = recId.value.trim();
        if (!receiver) return alert("Please select a valid user to call.");

        isCaller = true;
        activeCallId = `call_${Date.now()}`;
        document.getElementById("videoCallPeerName").textContent = receiver;
        document.getElementById("videoCallStatus").textContent = "Ringing...";

        // Show stage and emit initiate event
        videoStage.classList.remove("hidden");
        socket.emit("video:initiateCall", {
          callId: activeCallId,
          callerId: activeUser,
          receiverId: receiver,
        });
      });

      // Accept / Reject Buttons on Modal
      document
        .getElementById("acceptCallBtn")
        .addEventListener("click", async () => {
          document.getElementById("incomingCallModal").classList.add("hidden");
          document.getElementById("videoCallPeerName").textContent =
            document.getElementById("incomingCallName").textContent;
          document.getElementById("videoCallStatus").textContent =
            "Connecting...";

          socket.emit("video:respondToCall", {
            callId: activeCallId,
            callerId: document.getElementById("incomingCallName").textContent,
            responderId: activeUser,
            status: "accepted",
          });

          await initMedia();
          socket.emit("video:joinRoom", {
            callId: activeCallId,
            participantId: activeUser,
          });
        });

      document.getElementById("rejectCallBtn").addEventListener("click", () => {
        socket.emit("video:respondToCall", {
          callId: activeCallId,
          callerId: document.getElementById("incomingCallName").textContent,
          responderId: activeUser,
          status: "rejected",
        });
        resetVideoCall();
      });

      // Hang Up Button inside Stage
      document.getElementById("endCallBtn").addEventListener("click", () => {
        if (activeCallId && socket)
          socket.emit("video:leaveCall", {
            callId: activeCallId,
            participantId: activeUser,
          });
        resetVideoCall();
      });

      // Media Toggles inside Stage
      document
        .getElementById("toggleAudioBtn")
        .addEventListener("click", function () {
          if (!localStream) return;
          const track = localStream.getAudioTracks()[0];
          track.enabled = !track.enabled;
          this.classList.toggle("bg-white/20");
          this.classList.toggle("bg-red-500/80"); // Turn red when muted
        });

      document
        .getElementById("toggleVideoBtn")
        .addEventListener("click", function () {
          if (!localStream) return;
          const track = localStream.getVideoTracks()[0];
          track.enabled = !track.enabled;
          this.classList.toggle("bg-white/20");
          this.classList.toggle("bg-red-500/80");
        });
    </script>
  </body>
</html>
