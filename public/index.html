<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SaaS Chat Workspace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Inter", sans-serif;
      }
      #chatScroll::-webkit-scrollbar {
        width: 6px;
      }
      #chatScroll::-webkit-scrollbar-thumb {
        background: rgba(15, 23, 42, 0.1);
        border-radius: 99px;
      }
      #convoList::-webkit-scrollbar {
        width: 4px;
      }
      #convoList::-webkit-scrollbar-thumb {
        background: rgba(15, 23, 42, 0.1);
        border-radius: 99px;
      }
      .fade-in {
        animation: fadeIn 0.3s ease-in-out;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>
  <body class="h-screen w-screen bg-slate-50 overflow-hidden text-slate-800">
    <!-- LOGIN SCREEN -->
    <div
      id="loginScreen"
      class="absolute inset-0 z-50 flex items-center justify-center bg-gradient-to-br from-slate-900 to-blue-900"
    >
      <div class="bg-white rounded-3xl shadow-2xl p-10 w-full max-w-md fade-in">
        <div class="text-center mb-8">
          <div
            class="w-16 h-16 bg-blue-100 text-blue-600 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-sm"
          >
            <svg
              class="w-8 h-8"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"
              ></path>
            </svg>
          </div>
          <h2 class="text-2xl font-bold text-slate-800">SaaS Chat Login</h2>
          <p class="text-sm text-slate-500 mt-1">
            Enter your details to connect
          </p>
        </div>

        <div class="space-y-4">
          <div>
            <label
              class="text-xs font-semibold text-slate-500 uppercase tracking-wider"
              >My User ID</label
            ><input
              id="myUserId"
              class="mt-1.5 p-3.5 bg-slate-50 border border-slate-200 rounded-xl w-full focus:ring-2 focus:ring-blue-500 outline-none transition-all"
              placeholder="e.g. UserA"
            />
          </div>
          <div>
            <label
              class="text-xs font-semibold text-slate-500 uppercase tracking-wider"
              >Receiver ID</label
            ><input
              id="receiverId"
              class="mt-1.5 p-3.5 bg-slate-50 border border-slate-200 rounded-xl w-full focus:ring-2 focus:ring-blue-500 outline-none transition-all"
              placeholder="e.g. UserB"
            />
          </div>
          <div>
            <label
              class="text-xs font-semibold text-slate-500 uppercase tracking-wider"
              >Conversation ID</label
            ><input
              id="convId"
              class="mt-1.5 p-3.5 bg-slate-50 border border-slate-200 rounded-xl w-full focus:ring-2 focus:ring-blue-500 outline-none transition-all font-mono text-sm"
              value="conv_123"
            />
          </div>
          <button
            id="startChatBtn"
            class="w-full bg-blue-600 hover:bg-blue-700 text-white py-4 rounded-xl font-bold transition-colors mt-4 shadow-lg shadow-blue-600/30"
          >
            Connect & Enter Workspace
          </button>
        </div>
      </div>
    </div>

    <!-- MAIN DASHBOARD -->
    <div id="mainApp" class="h-full w-full flex hidden fade-in">
      <aside
        class="w-80 lg:w-96 bg-slate-50 border-r border-slate-200 flex flex-col shadow-[4px_0_24px_rgba(0,0,0,0.02)] z-10"
      >
        <div
          class="h-20 px-6 flex items-center justify-between border-b border-slate-200 bg-white"
        >
          <div class="flex items-center gap-3">
            <div
              class="w-10 h-10 rounded-full bg-gradient-to-tr from-blue-600 to-sky-500 text-white flex items-center justify-center font-bold shadow-sm"
            >
              <span id="currentUserInitial">U</span>
            </div>
            <div>
              <div
                id="currentUserDisplay"
                class="font-bold text-slate-800 leading-tight"
              >
                Loading...
              </div>
              <div
                class="text-xs text-green-500 font-medium flex items-center gap-1 mt-0.5"
              >
                <div class="w-2 h-2 rounded-full bg-green-500"></div>
                Online
              </div>
            </div>
          </div>
          <button
            onclick="showLogin()"
            class="w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 flex items-center justify-center text-slate-600 transition-colors"
            title="New Chat"
          >
            <svg
              class="w-4 h-4"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M12 4v16m8-8H4"
              ></path>
            </svg>
          </button>
        </div>
        <div class="flex-1 overflow-hidden flex flex-col bg-white">
          <div class="px-6 py-4">
            <h3
              class="text-xs font-bold text-slate-400 uppercase tracking-wider"
            >
              Active Conversations
            </h3>
          </div>
          <div id="convoList" class="flex-1 overflow-y-auto"></div>
        </div>
      </aside>

      <section
        class="flex-1 flex flex-col bg-[url('https://www.transparenttextures.com/patterns/cubes.png')] bg-slate-50/90 bg-blend-overlay relative"
      >
        <div
          class="h-20 px-8 border-b border-slate-200 bg-white/80 backdrop-blur-md flex items-center justify-between shadow-sm sticky top-0 z-10"
        >
          <div>
            <h2 id="chatHeaderTitle" class="text-lg font-bold text-slate-800">
              Select a chat
            </h2>
            <p
              id="chatHeaderSub"
              class="text-xs text-slate-500 font-medium mt-0.5"
            >
              Connect to start messaging
            </p>
          </div>
          <span
            id="typingIndicator"
            class="text-sm text-blue-500 bg-blue-50 px-3 py-1 rounded-full font-medium hidden animate-pulse"
            >Someone is typing...</span
          >
        </div>
        <div id="chatScroll" class="flex-1 p-8 overflow-y-auto space-y-6"></div>
        <div class="p-6 bg-white border-t border-slate-200">
          <div class="flex items-center gap-3 max-w-5xl mx-auto">
            <div class="flex-1 relative">
              <input
                id="messageInput"
                class="w-full bg-slate-100 border-transparent focus:bg-white focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10 rounded-2xl px-6 py-4 outline-none transition-all pr-12 text-slate-700 placeholder-slate-400"
                placeholder="Type your message..."
                disabled
              />
            </div>
            <button
              id="sendBtn"
              class="bg-blue-600 hover:bg-blue-700 text-white w-14 h-14 rounded-2xl flex items-center justify-center disabled:opacity-50 disabled:cursor-not-allowed shadow-md shadow-blue-600/20 transition-transform active:scale-95"
              disabled
            >
              <svg
                class="w-6 h-6 ml-1"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"
                ></path>
              </svg>
            </button>
          </div>
        </div>
      </section>
    </div>

    <!-- MESSAGE TEMPLATE -->
    <template id="msgTpl">
      <div class="msg-wrapper flex items-end gap-3 w-full justify-start">
        <div
          class="msg-avatar bg-gradient-to-tr from-slate-200 to-slate-300 text-slate-600 w-8 h-8 rounded-full flex items-center justify-center text-xs font-bold shadow-sm shrink-0 mb-1"
        >
          U
        </div>
        <div
          class="msg-bubble bg-white border border-slate-100 shadow-sm p-3.5 rounded-2xl rounded-bl-sm relative group min-w-[120px] max-w-[70%] transition-colors"
        >
          <div
            class="text-[15px] msg-text whitespace-pre-wrap text-slate-800 leading-relaxed"
          ></div>
          <div
            class="text-[10px] text-slate-400 mt-1.5 flex justify-between items-center gap-3"
          >
            <span class="sender-time font-medium"></span>
            <span class="read-status text-blue-500 font-bold hidden">✓✓</span>
          </div>
          <div
            class="reactions-display absolute -bottom-3 right-4 bg-white border border-slate-100 shadow-sm rounded-full px-2 py-0.5 text-xs hidden z-10"
          ></div>
          <div
            class="actions absolute -top-10 right-0 bg-slate-800 text-white rounded-xl shadow-lg hidden group-hover:flex overflow-hidden transform scale-90 origin-bottom-right"
          >
            <button
              class="emoji-btn text-xs px-3 py-2 hover:bg-slate-700 border-r border-slate-700 transition-colors"
            >
              😊
            </button>
            <button
              class="delete-btn text-xs px-3 py-2 text-red-400 hover:bg-slate-700 hover:text-red-300 transition-colors hidden font-medium"
            >
              Delete
            </button>
          </div>
        </div>
      </div>
    </template>

    <script>
      // Make sure this points exactly to your Render proxy URL!
      const LOCAL_URL = "https://nverify-test-software.onrender.com";

      const [
        myId,
        recId,
        convId,
        btn,
        chat,
        msgInput,
        sendBtn,
        typInd,
        convoList,
      ] = [
        "myUserId",
        "receiverId",
        "convId",
        "startChatBtn",
        "chatScroll",
        "messageInput",
        "sendBtn",
        "typingIndicator",
        "convoList",
      ].map((id) => document.getElementById(id));

      let socket, activeUser, currentRoom;
      const domNodes = new Map();

      function showLogin() {
        document.getElementById("mainApp").classList.add("hidden");
        document.getElementById("loginScreen").classList.remove("hidden");
      }

      function renderMsg(msg) {
        if (domNodes.has(msg._id)) return;
        const tpl = document.getElementById("msgTpl").content.cloneNode(true);
        const [wrapper, bubble, text, avatar, delBtn, readSt, reactDisp, time] =
          [
            ".msg-wrapper",
            ".msg-bubble",
            ".msg-text",
            ".msg-avatar",
            ".delete-btn",
            ".read-status",
            ".reactions-display",
            ".sender-time",
          ].map((sel) => tpl.querySelector(sel));

        domNodes.set(msg._id, wrapper);
        avatar.textContent = (msg.senderId || "U")[0].toUpperCase();
        text.textContent = msg.deleted ? "🚫 Message deleted" : msg.message;
        time.textContent = new Date(msg.createdAt).toLocaleTimeString([], {
          hour: "2-digit",
          minute: "2-digit",
        });

        if (msg.senderId === activeUser) {
          wrapper.classList.remove("justify-start");
          wrapper.classList.add("justify-end");

          bubble.classList.replace("bg-white", "bg-blue-600");
          bubble.classList.replace("rounded-bl-sm", "rounded-br-sm");
          bubble.classList.remove("border", "border-slate-100");
          text.classList.replace("text-slate-800", "text-white");
          time.classList.replace("text-slate-400", "text-blue-200");
          readSt.classList.replace("text-blue-500", "text-blue-200");

          avatar.classList.add("hidden");
          if (!msg.deleted) delBtn.classList.remove("hidden");
          if (msg.seen) readSt.classList.remove("hidden");
        }

        if (msg.reactions?.length) {
          reactDisp.textContent = msg.reactions
            .map((r) => r.reaction)
            .join(" ");
          reactDisp.classList.remove("hidden");
        }

        tpl.querySelector(".emoji-btn").onclick = () => {
          const r = prompt("React with Emoji (e.g. 👍, ❤️)");
          if (r && socket)
            socket.emit("chat:addReaction", {
              messageId: msg._id,
              reaction: r,
              senderId: activeUser,
            });
        };

        delBtn.onclick = () => {
          if (confirm("Delete this message?"))
            socket.emit("chat:deleteMessage", {
              messageId: msg._id,
              senderId: activeUser,
            });
        };

        wrapper.onmouseenter = () => {
          if (msg.receiverId === activeUser && !msg.seen) {
            socket.emit("chat:markAsRead", {
              messageId: msg._id,
              receiverId: activeUser,
            });
            msg.seen = true;
          }
        };

        chat.appendChild(tpl);
        chat.scrollTop = chat.scrollHeight;
      }

      btn.onclick = () => {
        activeUser = myId.value.trim();
        currentRoom = convId.value.trim();

        if (!activeUser || !currentRoom)
          return alert("My User ID and Conversation ID are required!");
        if (socket) socket.disconnect();

        // FIX: Enabled polling fallback to prevent connection drops on Render
        socket = io(LOCAL_URL, {
          auth: { identity: { userID: activeUser } },
          transports: ["polling", "websocket"],
        });

        socket.on("connect", () => {
          msgInput.disabled = sendBtn.disabled = false;
          msgInput.focus();

          document.getElementById("loginScreen").classList.add("hidden");
          document.getElementById("mainApp").classList.remove("hidden");
          document.getElementById("currentUserDisplay").textContent =
            activeUser;
          document.getElementById("currentUserInitial").textContent =
            activeUser[0].toUpperCase();
          document.getElementById("chatHeaderTitle").textContent = currentRoom;
          document.getElementById("chatHeaderSub").textContent =
            `Chatting with ${recId.value.trim() || "Group"}`;

          socket.emit("chat:joinChat", {
            conversationId: currentRoom,
            senderId: activeUser,
            receiverId: recId.value.trim() || null,
            endUserId: activeUser,
          });
          socket.emit("chat:getConversations");
        });

        socket.on("chat:error", (err) => {
          console.error("Backend Error:", err);
          alert("Server Error: " + (err.message || JSON.stringify(err)));
        });

        socket.on("chat:history", (data) => {
          chat.innerHTML = "";
          domNodes.clear();
          data.messages.forEach(renderMsg);
        });

        socket.on("chat:newMessage", (msg) => {
          if (msg.conversationId === currentRoom) renderMsg(msg);
        });

        // ==========================================
        // UI UPDATE: Sidebar Typing Indicator Logic
        // ==========================================
        socket.on("chat:typing", ({ isTyping, conversationId, senderId }) => {
          // Prevent showing typing indicator for ourselves
          if (senderId === activeUser) return;

          // 1. Update the top Header if we are currently looking at that specific chat
          if (conversationId === currentRoom) {
            typInd.style.display = isTyping ? "block" : "none";
          }

          // 2. Update the Sidebar Conversation List
          const typingSidebarEl = document.getElementById(
            `convo-typing-${conversationId}`,
          );
          const messageSidebarEl = document.getElementById(
            `convo-msg-${conversationId}`,
          );

          if (typingSidebarEl && messageSidebarEl) {
            if (isTyping) {
              typingSidebarEl.classList.remove("hidden");
              messageSidebarEl.classList.add("hidden");
            } else {
              typingSidebarEl.classList.add("hidden");
              messageSidebarEl.classList.remove("hidden");
            }
          }
        });

        socket.on("chat:reactionUpdated", ({ messageId, reactions }) => {
          const d = domNodes
            .get(messageId)
            ?.querySelector(".reactions-display");
          if (d) {
            d.textContent = reactions.map((r) => r.reaction).join(" ");
            reactions.length
              ? d.classList.remove("hidden")
              : d.classList.add("hidden");
          }
        });

        socket.on("chat:messageRead", ({ messageId }) =>
          domNodes
            .get(messageId)
            ?.querySelector(".read-status")
            ?.classList.remove("hidden"),
        );

        socket.on("chat:messageDeleted", ({ messageId }) => {
          const el = domNodes.get(messageId);
          if (el) {
            const txt = el.querySelector(".msg-text");
            txt.textContent = "🚫 This message was deleted";
            txt.className = "text-[14px] text-white/70 italic";
            el.querySelector(".actions")?.remove();
          }
        });

        socket.on("chat:conversations", ({ chats }) => {
          convoList.innerHTML = "";
          chats.forEach((c) => {
            const div = document.createElement("div");
            div.className =
              "px-6 py-4 border-b border-slate-100 cursor-pointer hover:bg-slate-50 transition-colors flex items-center justify-between group";

            const initials = (c.participantId || "G")[0].toUpperCase();
            const badge = c.unreadCount
              ? `<span class="bg-blue-600 text-white rounded-full px-2.5 py-0.5 text-[10px] font-bold shadow-sm shrink-0">${c.unreadCount}</span>`
              : "";

            div.innerHTML = `
              <div class="flex items-center gap-3 overflow-hidden">
                <div class="w-10 h-10 rounded-full bg-slate-200 text-slate-600 flex items-center justify-center font-bold shrink-0">${initials}</div>
                <div class="flex flex-col min-w-0">
                  <span class="font-bold text-slate-800 text-sm truncate group-hover:text-blue-600 transition-colors">${c.participantId || "Group"}</span>
                  <span id="convo-msg-${c.conversationId}" class="text-xs text-slate-500 truncate mt-0.5">${c.lastMessage}</span>
                  <span id="convo-typing-${c.conversationId}" class="text-[11px] font-bold text-blue-500 mt-0.5 hidden animate-pulse">Typing...</span>
                </div>
              </div>
              ${badge}
            `;

            div.onclick = () => {
              convId.value = c.conversationId;
              recId.value = c.participantId;
              btn.click();
            };
            convoList.appendChild(div);
          });
        });
      };

      let typingTimeout;
      msgInput.oninput = () => {
        if (!socket) return;

        // Emitting receiverId so the backend knows whose sidebar to update globally
        const receiver = recId.value.trim();
        socket.emit("chat:typing:start", {
          conversationId: currentRoom,
          receiverId: receiver,
        });

        clearTimeout(typingTimeout);
        typingTimeout = setTimeout(
          () =>
            socket.emit("chat:typing:stop", {
              conversationId: currentRoom,
              receiverId: receiver,
            }),
          1000,
        );
      };

      sendBtn.onclick = () => {
        const messageText = msgInput.value.trim();
        if (!messageText || !socket) return;

        socket.emit("chat:sendMessage", {
          conversationId: currentRoom,
          senderId: activeUser,
          receiverId: recId.value.trim() || null,
          message: messageText,
        });

        msgInput.value = "";
      };

      msgInput.onkeydown = (e) => {
        if (e.key === "Enter") {
          e.preventDefault();
          sendBtn.click();
        }
      };
    </script>
  </body>
</html>
